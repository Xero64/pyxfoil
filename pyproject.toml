[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxfoil"
version = "0.0.7"
authors = [
  { name="Xero64", email="xero64@gmail.com" },
]
description = "Run XFoil from within Python and work with output results."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { text = "MIT" }
license-files = ["LICEN[CS]E*"]
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
]

[project.urls]
Homepage = "https://github.com/Xero64/pyxfoil"
Issues = "https://github.com/Xero64/pyxfoil/issues"
